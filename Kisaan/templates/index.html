<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisaan Sathi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-white: #ffffff;
      --dark-green-base: #0B3B24;
      --dark-green-deep: #062416;
      --wheat-gold: #D99B00;
      --gold-bright: #F5B041;
      --mint-glow: #10B981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg-white);
      /* Subtle radiant green aura on pure white */
      background-image: radial-gradient(circle at center, rgba(11, 59, 36, 0.05) 0%, #ffffff 70%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Soft ambient glow behind the logo */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(11, 59, 36, 0.12) 0%, rgba(217, 155, 0, 0.08) 40%, transparent 70%);
      filter: blur(50px);
      animation: pulseGlow 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Centered Brand Unit */
    .brand-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 2;
    }

    /* Logo Wrapper */
    .logo-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Rotating delicate golden dashed ring */
    .logo-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px dashed rgba(217, 155, 0, 0.45);
      animation: rotateRing 22s linear infinite;
    }

    /* Dark Green Emblem Circle */
    .logo-circle {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--dark-green-base), var(--dark-green-deep));
      border: 2px solid rgba(217, 155, 0, 0.35);
      box-shadow: 0 20px 40px rgba(11, 59, 36, 0.22),
                  0 4px 12px rgba(11, 59, 36, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatLogo 3.5s ease-in-out infinite alternate;
    }

    .logo-svg {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
    }

    /* SVG elements & stroke animation */
    .path-leaf {
      stroke-dasharray: 90;
      stroke-dashoffset: 90;
      animation: drawStroke 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    .sun-glow {
      transform-origin: center;
      animation: pulseSun 3s ease-in-out infinite alternate;
    }

    /* App Name Typography */
    .app-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      /* Shimmering Dark Green infused with Golden Light */
      background: linear-gradient(
        90deg,
        #0B3B24 0%,
        #D99B00 28%,
        #0B3B24 55%,
        #10B981 80%,
        #0B3B24 100%
      );
      background-size: 220% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shimmer 4.5s linear infinite, fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 0% center;
      }
      100% {
        background-position: 220% center;
      }
    }

    @keyframes floatLogo {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-9px);
      }
    }

    @keyframes rotateRing {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes pulseSun {
      0% {
        transform: scale(0.9);
        opacity: 0.75;
      }
      100% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    @keyframes drawStroke {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Subtle ambient halo on white -->
  <div class="ambient-glow"></div>

  <!-- Centered Logo + App Name -->
  <div class="brand-container">
    
    <div class="logo-wrapper">
      <div class="logo-ring"></div>
      
      <div class="logo-circle">
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Rising Sun (Harvest Gold) -->
          <circle class="sun-glow" cx="50" cy="44" r="14" fill="#F5B041" fill-opacity="0.3"/>
          <circle class="sun-glow" cx="50" cy="44" r="9" fill="#D99B00"/>
          
          <!-- Horizon Base Line -->
          <path d="M26 74C36 71 64 71 74 74" stroke="#F5B041" stroke-width="2" stroke-linecap="round"/>

          <!-- Golden Left Sprout / Wheat Blade -->
          <path class="path-leaf" d="M50 72C50 60 38 48 30 48C30 58 40 70 50 72Z" 
                fill="#F5B041" stroke="#D99B00" stroke-width="1.8"/>

          <!-- Bright Emerald Right Leaf -->
          <path class="path-leaf" d="M50 72C50 56 65 44 70 42C70 55 58 68 50 72Z" 
                fill="#10B981" stroke="#A7F3D0" stroke-width="1.8"/>

          <!-- Central Golden Stem -->
          <path d="M50 74V50" stroke="#F5B041" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Animated Name -->
    <h1 class="app-title">Kisaan Sathi</h1>

  </div>


  <script>
    setTimeout(function () {
      window.location.href = "{{ target_url }}";   }, 5000);
  </script>
</body>
</html>
